- name: Create Security Group for WebServer
  amazon.aws.ec2_security_group:
      name: webserver-ansible-01
      description: "To allow http, https and SSH connections to webserver"
      region: us-east-2
      state: present
      rules:
        - proto: tcp
          from_port: 80
          to_port: 80
          cidr_ip: 0.0.0.0/0
        - proto: tcp
          from_port: 443
          to_port: 443
          cidr_ip: 0.0.0.0/0
        - proto: tcp
          from_port: 22
          to_port: 22
          cidr_ip: 0.0.0.0/0
      rules_egress:
        - proto: all
          cidr_ip: 0.0.0.0/0
          rule_desc: "Allow all outbound traffic"
- name: Create Security Group for DB Server
  amazon.aws.ec2_security_group:
      name: database-ansible-01
    description: "To Allow MySQL connections from Webserver to DB, and also allow SSH"
      region: us-east-2
      state: present
      rules:
        - proto: tcp
          group_name: webserver-ansible-01
          from_port: 3306
          to_port: 3306
        
        - proto: tcp
          from_port: 22
          to_port: 22
          cidr_ip: 0.0.0.0/0
        
      rules_egress:
        - proto: all
          cidr_ip: 0.0.0.0/0

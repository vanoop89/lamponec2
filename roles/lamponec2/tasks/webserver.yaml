- name: Install Apache/HTTPD WebServer
  ansible.builtin.dnf:
    name: httpd
    state: present
  notify: Start Apache

- name: Install PHP Packages
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop:
    - php
    - php-mbstring
    - php-zip
    - php-curl
    - php-mysqlnd
  notify: Start PHP-FPM

- name: Download Wordpress files
  ansible.builtin.unarchive:
    src: https://wordpress.org/latest.zip
    dest: "{{ DocumentRoot }}"
    remote_src: yes

- name: Copy Wordpress files to DocumentRoot directory 
  ansible.builtin.copy:
    src: /var/www/html/wordpress/
    dest: /var/www/html/
    remote_src: yes

- name: Delete Wordpress download directory
  ansible.builtin.file:
    path: /var/www/html/wordpress
    state: absent

          
